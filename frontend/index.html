<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FBFAF7" />
    <meta name="description" content="Bazaario - agricultural marketplace. Contact shops directly to buy." />
    <title>Bazaario marketplace</title>
    <!-- Warm up third-party origins before the app requests them. -->
    <link rel="preconnect" href="https://upload.wikimedia.org" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://api.mymemory.translated.net" />
    <link rel="dns-prefetch" href="https://translate.googleapis.com" />
    <!-- Fonts load in parallel with the app instead of blocking first render. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" />
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
