services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bazaario}
      POSTGRES_USER: ${POSTGRES_USER:-bazaario}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env or the shell}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - bazaario-postgres:/var/lib/postgresql/data

volumes:
  bazaario-postgres:
